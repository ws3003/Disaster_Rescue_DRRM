# Raspberry Pi Edge Client 配置 (Stage 7-B)
# 本文件为默认配置; 命令行参数 --server/--interval/--quality 可覆盖。

# Windows FastAPI Gateway 地址 (树莓派 → 服务器)
server:
  api_url: "http://192.168.43.206:8000/api/v1/analyze"

# V4.1 Assistant 边缘人员快照同步 (Phase7.3)
# 填 server 的 vision snapshot 地址则启用; 空则关闭 vision 同步(不影响旧配置启动)。
assistant:
  vision_snapshot_url: "http://192.168.43.206:8000/api/v1/vision/snapshot"

camera:
  width: 1280
  height: 720

# 上传策略
upload:
  # 每多少秒上传一帧 (VLM 非视频流, 无需每帧上传)
  interval: 10
  # JPEG 压缩质量 (0-100)
  jpeg_quality: 90

# 本地感知桥接 (Stage 7-C): 边缘 YOLO/MediaPipe 状态 → person_events 融合上传
perception:
  # 默认开启; 若模型缺失/推理器初始化失败自动回退为"仅上传图片"
  enabled: true
  # 说明: 实际 YOLO 模型路径/推理设备由 V0.1.5 的 config/config.yaml 的
  #       model.path 与 resolve_device 决定; 本字段仅作展示/未来预留,
  #       桥接层按约束"只调用不接管"不读取它们。
  model_path: "models/disaster_best.pt"
  device: "cpu"

# ──────────────────────────────────────────────────────────────
# V4.0-B Agent 决策辅助 (feature/v4.0-edge-agent 接入)
# 默认关闭; 置 agent.enabled: true 后, 边缘感知 person_events 会旁路送入
# Agent.process_frame (Trigger→Memory→Planner→Executor→Tools→SQLite)。
# 任何 Agent 异常都不阻断原有 "perception → uploader" 上传链路。
# ──────────────────────────────────────────────────────────────
agent:
  enabled: true              # 默认关闭, 保持纯上传降级路径
  trigger:
    high_risk_must_alert: true  # Fall/Lying 高风险必须报警(可突破 cooldown)
  memory:
    cooldown_minutes: 30        # 防重报冷却(分钟)
  planner:
    cooldown_minutes: 30
    max_steps: 3

# SQLite 统一路径 (Agent/Executor/DatabaseTool 共用)
db:
  path: "data/drrm.db"

# Vision 工具配置
vision:
  snapshot_path: "data/latest_vision.json"
  recent_path: "data/vision_snapshots.jsonl"

# 通讯工具配置 (树莓派默认 mock, 不触达真实微信, 仅写 jsonl)
communication:
  channel: "mock"                # mock|wecom|dingtalk; 环境变量 COMMUNICATION_CHANNEL 优先
  log_path: "data/communication_log.jsonl"
  pending_path: "data/pending_communication.jsonl"

# ──────────────────────────────────────────────────────────────
# 边缘运行可观测/补偿 (阶段1 A+B)
# 不改变 Agent 链路, 仅在外围增加观测与 pending 补发驱动。
# ──────────────────────────────────────────────────────────────
observation:
  enabled: true
  # Agent 运行状态摘要输出周期(每 N 帧)
  status_every: 50
  # communication pending 自动补偿触发周期(每 N 帧)
  flush_every: 50

# 救援工具配置
rescue:
  snapshot_path: "data/latest_vision.json"

# ============================================================
# V4.4 E7 传感器配置（开发联调参数，非现场安全认证标准）
# 供 src.sensor.config.load_sensor_config 读取；两级高温+恢复阈值。
# ============================================================
sensor:
  sensor_id: "dht11-01"
  # 读取器选择: "ds18b20"=真实 One-Wire 温度; "fake"=测试/离线 Mock(需显式 provider)
  reader: "ds18b20"
  # DS18B20 One-Wire 设备 (Raspberry Pi 已识别: 28-0224e33f1e4e, GPIO4)
  device_id: "28-0224e33f1e4e"
  device_dir: "/sys/bus/w1/devices"
  # E7-02 读数量程（开发默认；以真实硬件规格为准可改）
  temperature_min: -40
  temperature_max: 85
  humidity_min: 0
  humidity_max: 100
  temperature_threshold: 40.0
  level2_threshold: 50.0
  recovery_threshold: 36.0
  sample_period_seconds: 10.0
  confirm_high_count: 3
  confirm_recovery_count: 3
  cooldown_seconds: 600.0

# V4.4 E8 视频取证（S1）。enabled=false 时禁用真实录像（不会伪造成功）；
# 每次告警触发录像时新建一个 PicameraFrameSource，录毕由 CameraRecorder 释放。
e8:
  enabled: false               # 生产接线前默认关闭；true 后才尝试真实摄像头录像
  record_seconds: 10           # 取证录像时长（秒）
  width: 1280                  # 录像分辨率
  height: 720
  fps: 15.0                    # 采集帧率
  codec: "mp4v"                # 视频编码（cv2.VideoWriter fourcc）
  tmp_dir: ""                  # 证据临时目录；空=系统临时目录
