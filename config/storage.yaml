# Snapshot 存储配置 (Phase 2.6)
# provider: local | aliyun_oss (当前实现 local, OSS 预留)
# AK/SK 绝不写在此文件; OSS 凭据用环境变量:
#   OSS_BUCKET / OSS_ENDPOINT / OSS_ACCESS_KEY / OSS_ACCESS_SECRET
storage:
  provider: aliyun_oss

  # Local 模式: snapshot URL 前缀 (实际静态服务由外部 server 挂载 data/snapshots/)
  local:
    base_url: ""

  # 预留: 阿里云 OSS (未接入)
  aliyun_oss:
    bucket: "disaster-rescue-images"
    endpoint: "oss-cn-hangzhou.aliyuncs.com"
    access_key: ""
    access_secret: ""
