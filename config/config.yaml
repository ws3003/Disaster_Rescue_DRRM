# ============================================================
# Disaster_Rescue_DRRM — V0.1 第一阶段配置
# 平台: Windows + RTX 4060 GPU (当前开发)；保留 CPU/GPU 切换
# 用途: test.jpg 单帧端到端闭环 (检测→姿态→状态→风险评估→救援排序→可视化)
# 说明: 时序因子(F2-F5)当前为单帧中性占位，接入视频源/TSF 后启用
# ============================================================

project:
  name: "Disaster_Rescue_DRRM"
  version: "0.1"

# ---------- 输入/输出 ----------
input:
  # 输入模式: "image" (图片/目录/视频文件走 --input 路径分流) | "camera" (实时摄像头)
  # 摄像头也可用 CLI 显式启动: python src/main.py --camera
  type: "image"          # image=文件输入(默认); camera=Pi 5 Picamera2 实时流
  path: "data/test.jpg"  # 文件输入路径 (单图/目录/视频)

output:
  dir: "outputs"                        # 可视化结果输出目录
  annotated_image: "v0.1_result.jpg"    # 单张输出时叠加 bbox+骨架+状态+风险+排序榜 的结果图
  json_dir: "json"                      # JSON 结果子目录 (相对 output.dir) -> outputs/json

# ---------- 视频回放 (V0.2-M0) ----------
# 仅文件回放 + 逐帧感知特征流 (PRD 4.2); 不含 tracking/TSF/动态 DRRM
video:
  extensions: [".mp4", ".avi", ".mov", ".mkv"]  # 视为视频输入的扩展名
  frame_stride: 1          # 抽帧步长: 每 N 帧处理 1 帧 (1=全帧; 长视频可降采样)
  out_video_dir: "videos"  # 标注视频子目录 (相对 output.dir) -> outputs/videos
  stream_dir: "stream"     # JSONL 特征流子目录 (相对 output.dir) -> outputs/stream
  out_codec: "mp4v"        # 输出视频编码
  stream_landmarks: true   # 特征流是否写入 33 关键点 (归一化坐标; M2/M3 离线重放需要)

# ---------- 实时摄像头 (Demo V0.1, Raspberry Pi 5 + Picamera2) ----------
# 启动: python src/main.py --camera (或置 input.type: "camera")
# 仅 Pi 5 + CSI 摄像头(Picamera2)支持; 每帧独立推理, 不含 tracking/TSF/动态DRRM
camera:
  width: 1280           # 采集分辨率 (720p 为 Pi Camera 全系列兼容安全值)
  height: 720
  fps: 15               # 采集帧率上限; 实际吞吐以推理速度为准 (背压取帧, 不积压)
  frame_stride: 1       # 每 N 个采集帧处理 1 帧 (1=每帧都处理)
  show_window: true     # cv2 实时标注窗口 (需桌面环境; headless 部署置 false)
  quit_key: "q"         # 窗口模式下按此键优雅退出
  record_video: false   # 同时录制标注 mp4 到 outputs/videos/ (默认关, 省 Pi 编码开销)
  write_stream: true    # 逐帧 JSONL 特征流落盘 outputs/stream/camera_<时间戳>.jsonl

# ---------- 设备 (CPU/GPU 可切换, 不写死 GPU) ----------
device:
  mode: "auto"    # auto=cuda if available else cpu; 也可显式指定 "cuda"/"cpu"
  force: null     # 手动覆盖设备, 例如 "cpu" / "0"; null 表示用 auto

# ---------- 检测 (YOLO) ----------
model:
  path: "models/disaster_best.pt"
  conf_thres: 0.35      # 检测置信度阈值
  iou_thres: 0.45       # NMS IoU 阈值
  imgsz: 640            # 推理尺寸

# ---------- 类别处理 ----------
classes:
  # 参与救援排序的人员类别 (V0.1 仅对人员推理/排序)
  persons: [1, 5]             # civilian=1, rescuer=5
  # 非人员类别 (检测到但只叠加标注, 不进排序榜)
  non_persons: [0, 2, 3, 4]   # cat, cow, dog, horse
  names: {0: "cat", 1: "civilian", 2: "cow", 3: "dog", 4: "horse", 5: "rescuer"}

# ---------- 姿态 (MediaPipe) ----------
pose:
  # V0.1 为单帧图片推理, 必须 static_image_mode=True (默认 False 是视频跟踪模式)
  # smooth_landmarks 是时域平滑, 对静态单帧无意义, 置 False
  static_image_mode: true
  smooth_landmarks: false
  model_complexity: 1     # 0/1/2, 1=balanced
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  # ROI 单人推理: 按检测框向外扩边比例(相对框高), 避免裁剪切断关键点
  roi_pad_ratio: 0.2
  # 肢体过小(框太小)时跳过姿态估计, 避免无效推理
  min_person_box_h: 40

# ---------- DRRM 动态风险推理 (V0.1 单帧版) ----------
# 第 3 周将按 PRD 9.5 三阶段标定回填权重(“标定阶段一”: 急救先验手工初值)
drrm:
  # F1 状态先验危险度基线 (排序: 躺/倒 > 挥手求救 > 坐 > 立)
  # 注: Static Lying 依赖持续时长, 单帧不判定, 视频阶段由 TSF 产出后并入
  state_risk:
    Lying: 0.90
    Fall: 0.95
    Help-Waving: 0.78
    Sitting: 0.55
    Standing: 0.35
  # 因子权重 (PRD 6.4: R = Σ αᵢ·wᵢ·fᵢ)
  alpha:
    f1_state: 1.0        # 状态风险(单帧主因子)
    f2_transition: 0.0   # 转移风险(时序, 单帧中性)
    f3_duration: 0.0     # 时长风险(时序, 单帧中性)
    f4_activity: 0.0     # 活跃度(时序, 单帧中性)
    f5_history: 0.0      # 历史记忆(时序, 单帧中性)
    # F6 为证据调制因子(乘性), F7 为聚合, 无需独立权重
  # F3 时长非线性累积参数 (PRD 6.4 D(t)=1-exp(-t/τ), 视频阶段启用)
  tau: 60.0
  # F5 历史记忆衰减系数 (视频阶段启用)
  lambda_history: 0.7
  # F6 证据权重: 下标为检测置信度×关键点可见度, 下限 w_min
  w_min: 0.25

# ---------- 可视化 ----------
visualize:
  draw_skeleton: true       # 画 33 关键点骨架
  draw_states: true         # 画状态标签
  draw_risk: true           # 画风险分
  draw_ranking_panel: true  # 画排序榜 (Top-K)
  top_k: 5                  # 排序榜展示的人数上限
  panel_font_scale: 0.7
  box_thickness: 2

seed: 0